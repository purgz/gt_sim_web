services:
  db:
    image: postgres:16
    ports:
      - "5432:5432"
    env_file: .env
    environment:
      POSTGRES_DB: egt
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
  
  sim-service:
    build: ./sim_service
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      SIM_INTERNAL_TOKEN: ${SIM_INTERNAL_TOKEN}