spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/egt}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

sim.service.url=${SIM_SERVICE_URL:http://localhost:8000}
sim.service.token=${SIM_INTERNAL_TOKEN}

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

minio.url=${MINIO_URL:http://localhost:9000}
minio.user=${MINIO_USER}
minio.password=${MINIO_PASSWORD}
minio.bucket=${MINIO_BUCKET:simulations}NIO_BUCKET}